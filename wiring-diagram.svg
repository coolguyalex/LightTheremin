<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .box { fill: #FFFFFF; stroke: #333333; stroke-width: 2; }
      .lbl { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #222222; }
      .lbl-small { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #555555; }
      .pin { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="#FAFAF8"/>

  <text x="600" y="45" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1C130D">Light Theremin — Wiring Diagram</text>
  <text x="600" y="72" text-anchor="middle" class="lbl-small">Pins 9 and 10 are reserved for audio output (Mozzi / Timer1) — don't reuse them for anything else.</text>

  <!-- Nano board -->
  <rect x="480" y="200" width="240" height="420" rx="8" fill="#2A2A2A" stroke="#000000" stroke-width="2"/>
  <text x="600" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Arduino Nano</text>
  <text x="600" y="256" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#AAAAAA">(clone, CH340)</text>

  <!-- onboard LED callout -->
  <circle cx="660" cy="230" r="6" fill="#FFC857"/>
  <line x1="666" y1="230" x2="860" y2="180" stroke="#B8860B" stroke-width="2"/>
  <rect x="860" y="150" width="260" height="60" rx="6" class="box"/>
  <text x="875" y="175" class="lbl">Onboard LED — pin D13</text>
  <text x="875" y="195" class="lbl-small">Built in. No wiring needed for calibration flash.</text>

  <!-- LEFT SIDE: LDR + 5 buttons -->
  <!-- LDR -->
  <line x1="480" y1="240" x2="240" y2="240" stroke="#2563EB" stroke-width="2.5"/>
  <text x="470" y="233" text-anchor="end" class="pin" fill="#2563EB">A0</text>
  <rect x="40" y="210" width="200" height="60" rx="6" class="box"/>
  <text x="55" y="235" class="lbl">LDR + 10kΩ resistor</text>
  <text x="55" y="255" class="lbl-small">voltage divider → analog in</text>

  <!-- Play D2 -->
  <line x1="480" y1="312" x2="240" y2="312" stroke="#16A34A" stroke-width="2.5"/>
  <text x="470" y="305" text-anchor="end" class="pin" fill="#16A34A">D2</text>
  <rect x="40" y="282" width="200" height="60" rx="6" class="box"/>
  <text x="55" y="307" class="lbl">Play button</text>
  <text x="55" y="327" class="lbl-small">produces sound while held</text>

  <!-- Octave D3 -->
  <line x1="480" y1="384" x2="240" y2="384" stroke="#16A34A" stroke-width="2.5"/>
  <text x="470" y="377" text-anchor="end" class="pin" fill="#16A34A">D3</text>
  <rect x="40" y="354" width="200" height="60" rx="6" class="box"/>
  <text x="55" y="379" class="lbl">Octave button</text>
  <text x="55" y="399" class="lbl-small">shifts range up/down</text>

  <!-- Key/Mode D4 -->
  <line x1="480" y1="456" x2="240" y2="456" stroke="#16A34A" stroke-width="2.5"/>
  <text x="470" y="449" text-anchor="end" class="pin" fill="#16A34A">D4</text>
  <rect x="40" y="426" width="200" height="60" rx="6" class="box"/>
  <text x="55" y="451" class="lbl">Key / mode button</text>
  <text x="55" y="471" class="lbl-small">cycles preset scales</text>

  <!-- Calibration D5 -->
  <line x1="480" y1="528" x2="240" y2="528" stroke="#16A34A" stroke-width="2.5"/>
  <text x="470" y="521" text-anchor="end" class="pin" fill="#16A34A">D5</text>
  <rect x="40" y="498" width="200" height="60" rx="6" class="box"/>
  <text x="55" y="523" class="lbl">Calibration button</text>
  <text x="55" y="543" class="lbl-small">sets min/max brightness</text>

  <!-- Quantization D6 -->
  <line x1="480" y1="600" x2="240" y2="600" stroke="#16A34A" stroke-width="2.5"/>
  <text x="470" y="593" text-anchor="end" class="pin" fill="#16A34A">D6</text>
  <rect x="40" y="570" width="200" height="60" rx="6" class="box"/>
  <text x="55" y="595" class="lbl">Quantization toggle</text>
  <text x="55" y="615" class="lbl-small">snap-to-scale on/off</text>

  <!-- RIGHT SIDE: audio out -->
  <line x1="720" y1="400" x2="900" y2="400" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="730" y="393" class="pin" fill="#7C3AED">D9</text>
  <line x1="900" y1="400" x2="900" y2="370" stroke="#7C3AED" stroke-width="2.5"/>
  <line x1="900" y1="400" x2="900" y2="430" stroke="#7C3AED" stroke-width="2.5"/>
  <line x1="900" y1="370" x2="960" y2="370" stroke="#7C3AED" stroke-width="2.5"/>
  <line x1="900" y1="430" x2="960" y2="430" stroke="#7C3AED" stroke-width="2.5"/>

  <rect x="960" y="345" width="200" height="55" rx="6" class="box"/>
  <text x="975" y="368" class="lbl">Piezo buzzer</text>
  <text x="975" y="388" class="lbl-small">via DC-blocking cap</text>

  <rect x="960" y="405" width="200" height="55" rx="6" class="box"/>
  <text x="975" y="428" class="lbl">3.5mm audio jack</text>
  <text x="975" y="448" class="lbl-small">via blocking cap + RC filter</text>

  <!-- BOTTOM: USB power -->
  <line x1="600" y1="620" x2="600" y2="720" stroke="#DC2626" stroke-width="2.5"/>
  <text x="612" y="675" class="pin" fill="#DC2626">5V / GND</text>
  <rect x="480" y="720" width="240" height="60" rx="6" class="box"/>
  <text x="495" y="745" class="lbl">USB cable</text>
  <text x="495" y="765" class="lbl-small">power only — wall adapter, bank, or PC</text>

  <!-- legend -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333333">
    <line x1="480" y1="830" x2="510" y2="830" stroke="#2563EB" stroke-width="3"/>
    <text x="518" y="834">analog in</text>
    <line x1="610" y1="830" x2="640" y2="830" stroke="#16A34A" stroke-width="3"/>
    <text x="648" y="834">digital / buttons</text>
    <line x1="790" y1="830" x2="820" y2="830" stroke="#7C3AED" stroke-width="3"/>
    <text x="828" y="834">audio out</text>
    <line x1="930" y1="830" x2="960" y2="830" stroke="#DC2626" stroke-width="3"/>
    <text x="968" y="834">power</text>
  </g>
</svg>
