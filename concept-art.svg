<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#2E2F5C"/>
      <stop offset="55%" stop-color="#1C1D3B"/>
      <stop offset="100%" stop-color="#101127"/>
    </radialGradient>

    <radialGradient id="ldrGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="32%" stop-color="#FFD57E"/>
      <stop offset="68%" stop-color="#FF9F45"/>
      <stop offset="100%" stop-color="#C9701E"/>
    </radialGradient>

    <radialGradient id="buttonGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </radialGradient>

    <pattern id="stripPattern" width="40" height="26" patternUnits="userSpaceOnUse">
      <rect width="40" height="26" fill="#3B2A20"/>
      <line x1="0" y1="13" x2="40" y2="13" stroke="#C97C3D" stroke-width="2" opacity="0.55"/>
      <circle cx="20" cy="13" r="3" fill="#1C130D" opacity="0.9"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="url(#bgGlow)"/>

  <!-- faint background circuit texture -->
  <path d="M 60 700 C 200 660, 260 720, 420 690 S 640 640, 780 700" stroke="#FFC857" stroke-width="1.5" fill="none" opacity="0.08"/>
  <path d="M 1140 120 C 1020 160, 980 90, 860 130 S 660 190, 520 130" stroke="#FFC857" stroke-width="1.5" fill="none" opacity="0.08"/>

  <!-- title -->
  <text x="600" y="95" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" fill="#FFC857">Light Theremin</text>
  <text x="600" y="132" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="20" fill="#C9CDE8">an instrument played with light</text>

  <!-- board -->
  <rect x="300" y="230" width="600" height="380" rx="10" fill="url(#stripPattern)" stroke="#1C130D" stroke-width="4"/>

  <!-- light rays behind LDR -->
  <g stroke="#FFC857" stroke-width="2.5" opacity="0.45">
    <line x1="600" y1="330" x2="600" y2="200"/>
    <line x1="600" y1="330" x2="690" y2="225"/>
    <line x1="600" y1="330" x2="740" y2="290"/>
    <line x1="600" y1="330" x2="740" y2="370"/>
    <line x1="600" y1="330" x2="690" y2="435"/>
    <line x1="600" y1="330" x2="510" y2="435"/>
    <line x1="600" y1="330" x2="460" y2="370"/>
    <line x1="600" y1="330" x2="460" y2="290"/>
    <line x1="600" y1="330" x2="510" y2="225"/>
  </g>

  <!-- LDR "eye" -->
  <circle cx="600" cy="330" r="72" fill="url(#ldrGlow)" stroke="#8C6A3F" stroke-width="6"/>
  <circle cx="600" cy="330" r="30" fill="#3B2A20" opacity="0.35"/>
  <text x="600" y="435" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#E8DFC8">light sensor</text>

  <!-- buttons -->
  <g font-family="Verdana, Arial, sans-serif" font-size="14" fill="#E8DFC8" text-anchor="middle">
    <circle cx="380" cy="520" r="20" fill="url(#buttonGrad)" stroke="#5C4813" stroke-width="2"/>
    <text x="380" y="558">Octave</text>

    <circle cx="490" cy="520" r="20" fill="url(#buttonGrad)" stroke="#5C4813" stroke-width="2"/>
    <text x="490" y="558">Key</text>

    <circle cx="600" cy="520" r="28" fill="url(#buttonGrad)" stroke="#5C4813" stroke-width="2.5"/>
    <text x="600" y="566" font-weight="700">Play</text>

    <circle cx="710" cy="520" r="20" fill="url(#buttonGrad)" stroke="#5C4813" stroke-width="2"/>
    <text x="710" y="558">Calib</text>

    <circle cx="820" cy="520" r="20" fill="url(#buttonGrad)" stroke="#5C4813" stroke-width="2"/>
    <text x="820" y="558">Quant</text>
  </g>

  <!-- USB out (left) -->
  <path d="M 300 430 C 220 440, 160 470, 90 460" stroke="#9CA3AF" stroke-width="6" fill="none" stroke-linecap="round"/>
  <rect x="60" y="446" width="34" height="20" rx="3" fill="#6B7280" stroke="#3F4653" stroke-width="2"/>
  <text x="77" y="500" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#C9CDE8">USB power</text>

  <!-- audio out (right) -->
  <path d="M 900 420 C 980 430, 1040 460, 1110 452" stroke="#9CA3AF" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="1130" cy="450" r="16" fill="#6B7280" stroke="#3F4653" stroke-width="2"/>
  <text x="1125" y="500" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#C9CDE8">buzzer + jack</text>

  <!-- sound wave flourish -->
  <path d="M 500 650 Q 520 620 540 650 T 580 650 T 620 650 T 660 650 T 700 650" stroke="#FFC857" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>

  <text x="600" y="700" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#8B8FBF">USB-powered · light-controlled · handmade</text>
</svg>
